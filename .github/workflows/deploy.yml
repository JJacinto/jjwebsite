name: Deploy to NAS

on:
  push:
    branches: [main]
    paths:
      - 'joao-website/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Expose Service Token to every step — cloudflared auto-reads these
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          
          {
            echo "Host nas"
            echo "  HostName ssh.joaojacinto.com"
            echo "  User jjacinto8"
            echo "  IdentityFile $HOME/.ssh/deploy_key"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  ProxyCommand cloudflared access ssh --hostname %h"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          
          echo "=== SSH config contents ==="
          cat "$HOME/.ssh/config"
          echo "=== Deploy key fingerprint ==="
          ssh-keygen -l -f "$HOME/.ssh/deploy_key"

      - name: Test SSH connection
        run: |
          ssh -F "$HOME/.ssh/config" nas "echo 'SSH connection successful' && whoami && hostname"

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --rsync-path="/usr/bin/rsync" \
            --exclude='.DS_Store' \
            --exclude='README.md' \
            -e "ssh -F $HOME/.ssh/config" \
            ./joao-website/ \
            nas:/volume1/Websites/Joao-website/joao-website/

      - name: Fix permissions on NAS
        run: |
          ssh -F "$HOME/.ssh/config" nas "sudo chmod 755 /volume1/Websites/Joao-website/joao-website && sudo chmod -R u+rw,go+r,go-w /volume1/Websites/Joao-website/joao-website/*"

      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'