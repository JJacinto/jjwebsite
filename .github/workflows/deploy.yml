name: Deploy to NAS

on:
  push:
    branches: [main]
    paths:
      - 'joao-website/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          
          {
            echo "Host nas"
            echo "  HostName ssh.joaojacinto.com"
            echo "  User jjacinto8"
            echo "  IdentityFile $HOME/.ssh/deploy_key"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  ProxyCommand cloudflared access ssh --hostname %h"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Test SSH connection
        run: |
          ssh -F "$HOME/.ssh/config" nas "echo 'SSH connection successful' && whoami && hostname"

      - name: Deploy via tar over SSH
        run: |
          tar -cz \
            --exclude='.DS_Store' \
            --exclude='README.md' \
            --exclude='nginx.conf' \
            --exclude='nginx.conf.backup' \
            --exclude='docker-compose.yml' \
            --exclude='docker-compose.yaml' \
            --exclude='Makefile' \
            --exclude='.gitignore' \
            --exclude='old-index.html' \
            --exclude='deploy.sh.txt' \
            --exclude='ds' \
            -C ./joao-website . \
          | ssh -F "$HOME/.ssh/config" nas \
            "tar -xz --overwrite -C /home/jjacinto8/sites/joaojacinto/public"

      - name: Fix permissions on NAS
        run: |
          ssh -F "$HOME/.ssh/config" nas "\
            find /home/jjacinto8/sites/joaojacinto/public -type d -exec chmod 755 {} \; && \
            find /home/jjacinto8/sites/joaojacinto/public -type f -exec chmod 644 {} \;"

      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'