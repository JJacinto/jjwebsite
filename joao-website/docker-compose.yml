version: "3.8"

services:
  web:
    image: nginx:alpine
    container_name: joao-website
    ports:
      - "8080:80"        # Change 8080 to 80 if you want default HTTP
      - "8443:443"       # For HTTPS (optional, needs certs)
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
