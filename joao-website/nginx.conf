server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects (e.g. /about -> /about/) keep the visitor's scheme and host.
    # Without this nginx writes http://… because Cloudflare talks to it over
    # plain HTTP, and the visitor lands on the insecure URL.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

    # Security headers. nginx drops these inside any location that sets its
    # own add_header, so the locations below include them again.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff2|woff|ttf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # Pages: serve the file if it exists, otherwise a real 404. The site is
    # static (Astro), so there is no SPA fallback: an unknown URL must not
    # answer 200 with the homepage.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # Astro builds 404.html; serve it with the 404 status.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Don't serve docker/config files
    location ~* (docker-compose|nginx\.conf|\.md|Makefile) {
        deny all;
    }
}
