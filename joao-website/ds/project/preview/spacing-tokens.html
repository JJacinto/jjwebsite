<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#ECEAE5;padding:28px 32px;font-family:'DM Sans',-apple-system,sans-serif;color:#1C1A17;}
.label{font-size:0.68rem;letter-spacing:0.06em;text-transform:uppercase;color:#9B948D;margin-bottom:14px;}
.row{display:flex;align-items:center;gap:24px;margin-bottom:20px;flex-wrap:wrap;}
.divider{border:none;border-top:1px solid rgba(28,26,23,0.08);margin:20px 0;}
.r-item{display:flex;flex-direction:column;align-items:center;gap:8px;}
.r-box{width:60px;height:60px;background:#F7F5F1;border:1px solid rgba(28,26,23,0.1);}
.r-label{font-size:0.7rem;color:#6B6560;text-align:center;}
.r-val{font-size:0.68rem;color:#9B948D;text-align:center;}
.s-item{flex:1;min-width:140px;}
.s-box{height:60px;background:#F7F5F1;border-radius:12px;margin-bottom:8px;}
.s-label{font-size:0.7rem;color:#6B6560;}
.s-val{font-size:0.68rem;color:#9B948D;}
</style>
</head>
<body>
<div class="label">Border Radius</div>
<div class="row">
  <div class="r-item">
    <div class="r-box" style="border-radius:8px"></div>
    <div class="r-label">radius-sm</div>
    <div class="r-val">8px</div>
  </div>
  <div class="r-item">
    <div class="r-box" style="border-radius:16px"></div>
    <div class="r-label">radius-md</div>
    <div class="r-val">16px</div>
  </div>
  <div class="r-item">
    <div class="r-box" style="border-radius:100px;width:90px;height:40px;display:flex;align-items:center;justify-content:center;font-size:0.72rem;color:#9B948D;border:1px solid rgba(28,26,23,0.1)">pill</div>
    <div class="r-label" style="margin-top:12px">radius-full</div>
    <div class="r-val">100px</div>
  </div>
</div>
<hr class="divider">
<div class="label">Shadows</div>
<div class="row">
  <div class="s-item">
    <div class="s-box" style="box-shadow:0 1px 4px rgba(0,0,0,0.04)"></div>
    <div class="s-label">shadow-sm</div>
    <div class="s-val">0 1px 4px · 4% opacity</div>
  </div>
  <div class="s-item">
    <div class="s-box" style="box-shadow:0 4px 16px rgba(0,0,0,0.06)"></div>
    <div class="s-label">shadow-md</div>
    <div class="s-val">0 4px 16px · 6% opacity</div>
  </div>
  <div class="s-item">
    <div class="s-box" style="box-shadow:0 8px 30px rgba(0,0,0,0.07)"></div>
    <div class="s-label">shadow-lg / hover</div>
    <div class="s-val">0 8px 30px · 7% opacity</div>
  </div>
</div>
</body>
</html>
