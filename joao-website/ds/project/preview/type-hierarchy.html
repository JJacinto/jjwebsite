<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@900&family=DM+Sans:wght@400&display=swap" rel="stylesheet">
<style>
@font-face { font-family:'Mona Sans'; src:url('https://github.githubassets.com/assets/mona-sans.woff2') format('woff2'); font-weight:400; font-display:swap; }
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#ECEAE5;padding:40px 36px;color:#1C1A17;}
.eyebrow{font-family:'Mona Sans','DM Sans',sans-serif;font-size:0.75rem;letter-spacing:0.06em;text-transform:uppercase;color:#9B948D;margin-bottom:12px;}
.title{font-family:'Hanken Grotesk',sans-serif;font-weight:900;font-size:2.8rem;letter-spacing:-0.035em;line-height:1.1;margin-bottom:16px;}
.accent{color:#3D3DB5;}
.lead{font-family:'Mona Sans','DM Sans',sans-serif;font-size:1.05rem;line-height:1.75;color:#6B6560;max-width:520px;margin-bottom:24px;}
.divider{border:none;border-top:1px solid rgba(28,26,23,0.08);margin:24px 0;}
.meta-row{display:flex;gap:40px;}
.meta-item label{font-family:'Mona Sans','DM Sans',sans-serif;font-size:0.72rem;letter-spacing:0.05em;text-transform:uppercase;color:#9B948D;display:block;margin-bottom:4px;}
.meta-item span{font-family:'Mona Sans','DM Sans',sans-serif;font-size:0.9rem;color:#1C1A17;}
</style>
</head>
<body>
  <div class="eyebrow">Design Leadership</div>
  <div class="title">Leading and managing<br>a <span class="accent">design system.</span></div>
  <div class="lead">How I built and scaled a component library from scratch at StreamYard — aligning design and engineering across a team of 20+ contributors.</div>
  <hr class="divider">
  <div class="meta-row">
    <div class="meta-item"><label>Company</label><span>StreamYard</span></div>
    <div class="meta-item"><label>Role</label><span>Senior Product Designer</span></div>
    <div class="meta-item"><label>Year</label><span>2022–2023</span></div>
  </div>
</body>
</html>
