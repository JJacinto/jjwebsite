<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#ECEAE5;padding:28px 32px;font-family:'DM Sans',-apple-system,sans-serif;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.swatch{border-radius:10px;height:72px;position:relative;}
.row{display:flex;gap:32px;flex-wrap:wrap;}
.item{display:flex;flex-direction:column;gap:4px;}
.swatch-sm{width:44px;height:44px;border-radius:8px;}
.name{font-size:0.7rem;color:#6B6560;letter-spacing:0.03em;}
.hex{font-size:0.75rem;color:#1C1A17;font-weight:500;}
.divider{border:none;border-top:1px solid rgba(28,26,23,0.08);margin:20px 0;}
.label{font-size:0.68rem;letter-spacing:0.06em;text-transform:uppercase;color:#9B948D;margin-bottom:10px;}
</style>
</head>
<body>
<div class="label">Backgrounds</div>
<div class="grid">
  <div>
    <div class="swatch" style="background:#ECEAE5;border:1px solid rgba(0,0,0,0.08)"></div>
    <div class="name" style="margin-top:6px">bg</div>
    <div class="hex">#ECEAE5</div>
  </div>
  <div>
    <div class="swatch" style="background:#E4E1DB;border:1px solid rgba(0,0,0,0.08)"></div>
    <div class="name" style="margin-top:6px">bg-alt</div>
    <div class="hex">#E4E1DB</div>
  </div>
  <div>
    <div class="swatch" style="background:#F7F5F1;border:1px solid rgba(0,0,0,0.08)"></div>
    <div class="name" style="margin-top:6px">surface</div>
    <div class="hex">#F7F5F1</div>
  </div>
  <div>
    <div class="swatch" style="background:#1C1A17"></div>
    <div class="name" style="margin-top:6px">dark</div>
    <div class="hex">#1C1A17</div>
  </div>
  <div>
    <div class="swatch" style="background:#262320"></div>
    <div class="name" style="margin-top:6px">dark-surface</div>
    <div class="hex">#262320</div>
  </div>
</div>
<hr class="divider">
<div class="label">Accent — Midnight Indigo</div>
<div class="row">
  <div class="item">
    <div class="swatch-sm" style="background:#3D3DB5"></div>
    <div class="name">accent</div>
    <div class="hex">#3D3DB5</div>
  </div>
  <div class="item">
    <div class="swatch-sm" style="background:#3030A0"></div>
    <div class="name">accent-dark</div>
    <div class="hex">#3030A0</div>
  </div>
  <div class="item">
    <div class="swatch-sm" style="background:#ECEAFF;border:1px solid rgba(0,0,0,0.08)"></div>
    <div class="name">accent-subtle</div>
    <div class="hex">#ECEAFF</div>
  </div>
  <div class="item">
    <div class="swatch-sm" style="background:#7B7BE0"></div>
    <div class="name">accent (dark mode)</div>
    <div class="hex">#7B7BE0</div>
  </div>
</div>
</body>
</html>
