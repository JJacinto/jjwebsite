<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Mona Sans';src:url('https://github.githubassets.com/assets/mona-sans.woff2') format('woff2');font-weight:400;font-display:swap;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#ECEAE5;font-family:'Mona Sans','DM Sans',sans-serif;padding:28px 32px;color:#1C1A17;}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:22px;}
.divider{border:none;border-top:1px solid rgba(28,26,23,0.08);margin:22px 0;}
.label{font-size:0.68rem;letter-spacing:0.06em;text-transform:uppercase;color:#9B948D;margin-bottom:12px;}

/* ── Base button ── */
.btn{
  display:inline-flex; align-items:center; gap:0;
  padding:12px 28px; border-radius:100px;
  font-size:0.9rem; font-family:inherit; cursor:pointer;
  position:relative;
  overflow:hidden;        /* clips ::before to pill shape */
  white-space:nowrap;
  transition:
    color       0.35s cubic-bezier(0.4,0,0.2,1),
    border-color 0.35s cubic-bezier(0.4,0,0.2,1),
    box-shadow  0.3s;
}

/* Fill overlay — invisible at rest, sweeps L→R on hover */
.btn::before{
  content:'';
  position:absolute; inset:0;
  transform:scaleX(0);
  transform-origin:left center;
  transition:transform 0.42s cubic-bezier(0.4,0,0.2,1);
  z-index:0;
}
.btn:hover::before{ transform:scaleX(1); }

/* All btn children sit above the fill */
.btn-icon, .btn > span{ position:relative; z-index:1; }

/* Icon: slides in from left */
.btn-icon{
  display:inline-flex; align-items:center;
  max-width:0; overflow:hidden; opacity:0;
  margin-right:0;
  transition:
    max-width   0.42s cubic-bezier(0.4,0,0.2,1),
    opacity     0.32s cubic-bezier(0.4,0,0.2,1),
    margin-right 0.42s cubic-bezier(0.4,0,0.2,1);
}
.btn:hover .btn-icon{ max-width:22px; opacity:1; margin-right:6px; }
.btn-icon svg{ width:18px; height:18px; flex-shrink:0; }

/* ── Ghost: transparent bg → midnight fill on hover ── */
.btn-ghost{
  background:rgba(255,255,255,0.5);
  border:3px solid rgba(28,26,23,0.10);
  color:#1C1A17;
}
.btn-ghost::before{ background:#3D3DB5; }
.btn-ghost:hover{
  color:#fff;
  border-color:rgba(61,61,181,0.55);
  box-shadow:0 6px 24px rgba(61,61,181,0.22);
}

/* ── Solid accent: darker sweep on hover ── */
.btn-accent{
  background:#3D3DB5;
  border:3px solid rgba(61,61,181,0.70);
  color:#fff;
}
.btn-accent::before{ background:#3030A0; }
.btn-accent:hover{
  border-color:rgba(61,61,181,0.9);
  box-shadow:0 6px 24px rgba(61,61,181,0.3);
}

/* ── Dark outline ── */
.btn-dark-outline{
  background:transparent;
  border:3px solid rgba(255,255,255,0.28);
  color:#F0EDE8;
}
.btn-dark-outline::before{ background:rgba(255,255,255,0.12); }
.btn-dark-outline:hover{
  border-color:rgba(255,255,255,0.6);
  color:#fff;
}

/* ── Small secondary ── */
.btn-sm{
  display:inline-flex; align-items:center; gap:0;
  padding:8px 20px; border-radius:100px;
  font-size:0.82rem; font-family:inherit; cursor:pointer;
  position:relative; overflow:hidden; white-space:nowrap;
  background:rgba(255,255,255,0.5);
  border:3px solid rgba(28,26,23,0.10);
  color:#6B6560;
  transition:color 0.35s cubic-bezier(0.4,0,0.2,1), border-color 0.35s;
}
.btn-sm::before{
  content:''; position:absolute; inset:0;
  background:#3D3DB5;
  transform:scaleX(0); transform-origin:left center;
  transition:transform 0.42s cubic-bezier(0.4,0,0.2,1);
  z-index:0;
}
.btn-sm:hover::before{ transform:scaleX(1); }
.btn-sm:hover{ color:#fff; border-color:rgba(61,61,181,0.55); }
.btn-sm .btn-icon,
.btn-sm > span{ position:relative; z-index:1; }

/* Tags */
.tag{display:inline-block;padding:6px 14px;border:3px solid rgba(28,26,23,0.10);border-radius:100px;font-size:0.8rem;color:#6B6560;background:#F7F5F1;}
.tag-accent{display:inline-block;padding:6px 14px;border:3px solid rgba(61,61,181,0.35);border-radius:100px;font-size:0.8rem;color:#3D3DB5;background:#ECEAFF;}
</style>
</head>
<body>

<div class="label">Primary actions — fill sweeps left→right on hover</div>
<div class="row">
  <button class="btn btn-ghost">
    <span class="btn-icon">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </span>
    <span>Learn more</span>
  </button>
  <button class="btn btn-ghost">
    <span class="btn-icon">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4h12v9H2z"/><path d="M2 4l6 5 6-5"/></svg>
    </span>
    <span>Let's connect</span>
  </button>
  <button class="btn btn-accent">
    <span class="btn-icon">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4h12v9H2z"/><path d="M2 4l6 5 6-5"/></svg>
    </span>
    <span>Contact me</span>
  </button>
</div>

<hr class="divider">
<div class="label">On dark background</div>
<div class="row" style="background:#1C1A17;padding:20px;border-radius:12px;">
  <button class="btn btn-accent">
    <span class="btn-icon">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4h12v9H2z"/><path d="M2 4l6 5 6-5"/></svg>
    </span>
    <span>Contact me</span>
  </button>
  <button class="btn btn-dark-outline">
    <span class="btn-icon">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h8M4 5h8M4 11h5"/></svg>
    </span>
    <span>View my CV</span>
  </button>
</div>

<hr class="divider">
<div class="label">Small / secondary · tags</div>
<div class="row">
  <button class="btn-sm">
    <span class="btn-icon" style="display:inline-flex;align-items:center;max-width:0;overflow:hidden;opacity:0;margin-right:0;transition:max-width .42s cubic-bezier(.4,0,.2,1),opacity .32s,margin-right .42s;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
    </span>
    <span>View case study</span>
  </button>
  <span class="tag">Research Ops</span>
  <span class="tag">Design Leadership</span>
  <span class="tag-accent">Design</span>
</div>

<script>
document.querySelectorAll('.btn-sm').forEach(btn => {
  const icon = btn.querySelector('.btn-icon');
  if (!icon) return;
  btn.addEventListener('mouseenter', () => {
    icon.style.maxWidth = '20px';
    icon.style.opacity = '1';
    icon.style.marginRight = '5px';
  });
  btn.addEventListener('mouseleave', () => {
    icon.style.maxWidth = '0';
    icon.style.opacity = '0';
    icon.style.marginRight = '0';
  });
});
</script>
</body>
</html>
