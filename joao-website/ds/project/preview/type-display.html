<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@900&family=DM+Sans:wght@400&display=swap" rel="stylesheet">
<style>
@font-face { font-family:'Mona Sans'; src:url('https://github.githubassets.com/assets/mona-sans.woff2') format('woff2'); font-weight:400; font-display:swap; }
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#ECEAE5;font-family:'Mona Sans','DM Sans',sans-serif;padding:32px;color:#1C1A17;}
.row{margin-bottom:24px;border-bottom:1px solid rgba(28,26,23,0.08);padding-bottom:24px;}
.row:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.meta{font-size:0.72rem;color:#9B948D;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:6px;}
.display{font-family:'Hanken Grotesk',sans-serif;font-weight:900;font-size:clamp(3rem,8vw,5.5rem);letter-spacing:-0.04em;line-height:1.0;color:#1C1A17;}
.h1{font-family:'Hanken Grotesk',sans-serif;font-weight:900;font-size:clamp(2.2rem,4vw,3.2rem);letter-spacing:-0.035em;line-height:1.1;color:#1C1A17;}
.h2{font-family:'Hanken Grotesk',sans-serif;font-weight:900;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-0.03em;line-height:1.15;color:#1C1A17;}
.h3{font-family:'Hanken Grotesk',sans-serif;font-weight:900;font-size:1.3rem;letter-spacing:-0.02em;line-height:1.3;color:#1C1A17;}
.accent{color:#3D3DB5;}
</style>
</head>
<body>
<div class="row">
  <div class="meta">Display · Hanken Grotesk 900 · −0.04em</div>
  <div class="display">João <span class="accent">Jacinto.</span></div>
</div>
<div class="row">
  <div class="meta">H1 · Hanken Grotesk 900 · −0.035em</div>
  <div class="h1">Senior Product Designer</div>
</div>
<div class="row">
  <div class="meta">H2 · Hanken Grotesk 900 · −0.03em</div>
  <div class="h2">Case Studies</div>
</div>
<div class="row">
  <div class="meta">H3 · Hanken Grotesk 900 · −0.02em</div>
  <div class="h3">Redefining webinar customization</div>
</div>
</body>
</html>
