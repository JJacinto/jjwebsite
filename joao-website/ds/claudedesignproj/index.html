<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>João Jacinto — Senior Product Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Mona Sans';
  src: url('https://github.githubassets.com/assets/mona-sans.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body, #root {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Mona Sans', 'DM Sans', sans-serif;
  background: #ECEAE5;
  color: #1C1A17;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

#root {
  display: flex;
  flex-direction: column;
}

button { font-family: inherit; }

/* Marquee animation */
@keyframes marquee {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* Scroll reveal */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition:
    opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
    transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-d1 { transition-delay: 0.08s; }
.reveal-d2 { transition-delay: 0.16s; }
.reveal-d3 { transition-delay: 0.24s; }
.reveal-d4 { transition-delay: 0.32s; }

@media (prefers-reduced-motion: reduce) {
  .reveal { transition: none; opacity: 1; transform: none; }
  @keyframes marquee { 0%, 100% { transform: none; } }
}

/* Footer */
.jj-footer {
  background: #1C1A17;
  border-top: 1px solid rgba(255,255,255,0.06);
  padding: 28px 40px;
  text-align: center;
  flex-shrink: 0;
}
.jj-footer p {
  font-family: 'Mona Sans', 'DM Sans', sans-serif;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.25);
  line-height: 1.7;
}
.jj-footer strong { color: rgba(255,255,255,0.4); }

/* Tweaks panel */
#tweaks-panel {
  display: none;
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  background: #1C1A17;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 20px;
  width: 240px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  font-family: 'Mona Sans', 'DM Sans', sans-serif;
}
#tweaks-panel h4 {
  font-size: 0.8rem;
  font-weight: 700;
  color: rgba(255,255,255,0.6);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 16px;
}
#tweaks-panel label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.78rem;
  color: rgba(255,255,255,0.45);
  margin-bottom: 14px;
}
#tweaks-panel select, #tweaks-panel input[type=range] {
  width: 100%;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  color: rgba(255,255,255,0.8);
  padding: 6px 10px;
  font-size: 0.82rem;
  font-family: inherit;
  cursor: pointer;
  appearance: none;
}
#tweaks-panel select option { background: #1C1A17; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="tokens.js"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="HomePage.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel" src="CaseDetail.jsx"></script>
</head>
<body>
<div id="root"></div>

<!-- Tweaks panel -->
<div id="tweaks-panel">
  <h4>Tweaks</h4>
  <label>
    Accent color
    <select id="tweak-accent" onchange="applyTweaks()">
      <option value="#3D3DB5">Violet (default)</option>
      <option value="#A0644E">Terracotta</option>
      <option value="#2D7A4F">Forest green</option>
      <option value="#1C1A17">Near-black</option>
    </select>
  </label>
  <label>
    Nav opacity
    <input type="range" id="tweak-nav-opacity" min="70" max="100" step="5" value="90" oninput="applyTweaks()">
  </label>
  <label>
    Card radius
    <select id="tweak-radius" onchange="applyTweaks()">
      <option value="16px">Rounded (default)</option>
      <option value="8px">Sharp</option>
      <option value="24px">Soft</option>
    </select>
  </label>
</div>

<script>
// Tweaks
function applyTweaks() {
  const accent = document.getElementById('tweak-accent').value;
  const navOpacity = document.getElementById('tweak-nav-opacity').value / 100;
  const radius = document.getElementById('tweak-radius').value;

  // Update token
  window.JJTokens.accent = accent;
  window.JJTokens.radiusMd = radius;

  // Propagate accent via CSS var hack
  document.documentElement.style.setProperty('--jj-accent', accent);

  // Notify host
  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accent, radius } }, '*');
}

// Edit mode toggle
window.addEventListener('message', (e) => {
  if (e.data?.type === '__activate_edit_mode') {
    document.getElementById('tweaks-panel').style.display = 'block';
  }
  if (e.data?.type === '__deactivate_edit_mode') {
    document.getElementById('tweaks-panel').style.display = 'none';
  }
});
window.parent.postMessage({ type: '__edit_mode_available' }, '*');
</script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#3D3DB5",
  "radius": "24px"
}/*EDITMODE-END*/;

function App() {
  const [page, setPage] = React.useState(() => localStorage.getItem('jj-page') || 'home');

  const navigate = (p) => {
    setPage(p);
    localStorage.setItem('jj-page', p);
    const root = document.getElementById('jj-scroll-root');
    if (root) root.scrollTop = 0;
  };

  const isContactPage = page === 'contact';

  return (
    <>
      <JJNav page={page} setPage={navigate} />
      <div id="jj-scroll-root" style={{ flex:1, overflowY:'auto', overflowX:'hidden' }}>
        {page === 'home'    && <JJHomePage setPage={navigate} />}
        {page === 'about'   && <JJAboutPage setPage={navigate} />}
        {page === 'cases'   && <JJCasesPage setPage={navigate} />}
        {page === 'contact' && <JJContactPage />}
        {page?.startsWith('case-') && <JJCaseDetail caseId={page} setPage={navigate} />}

        {!isContactPage && (
          <footer className="jj-footer">
            <p><strong>João Jacinto</strong> · Senior Product Designer · Aveiro, Portugal · Custom-designed & hand-coded · © 2025</p>
          </footer>
        )}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
